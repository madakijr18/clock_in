<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oasis Pulse - Smart Attendance Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070b14;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stars ── */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star  { position: absolute; background: white; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%,100%{opacity:.05} 50%{opacity:.9} }

    /* ── Grid ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(99,102,241,.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,.03) 1px, transparent 1px);
      background-size: 55px 55px;
    }

    /* ── Orbs ── */
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
    .orb1 { width:600px;height:600px;background:rgba(99,102,241,.18);top:-250px;right:-200px; animation:drift 14s ease-in-out infinite; }
    .orb2 { width:500px;height:500px;background:rgba(16,185,129,.14);bottom:-200px;left:-150px; animation:drift 18s ease-in-out infinite reverse; }
    @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,-40px)} }

    /* ── Page layout ── */
    .page {
      min-height: 100vh; position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem 1rem;
    }

    /* ── Brand ── */
    .brand {
      text-align: center; margin-bottom: 2.5rem;
    }
    .brand-logo {
      display: inline-flex; align-items: center; gap: .75rem;
      margin-bottom: 1rem;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; box-shadow: 0 6px 24px rgba(99,102,241,.5);
    }
    .brand-name { font-size: 1.6rem; font-weight: 900; color: white; }
    .brand-tagline { font-size: .88rem; color: rgba(255,255,255,.4); }

    /* ── Live clock ── */
    .live-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem; font-weight: 900; color: white;
      letter-spacing: .06em; text-align: center; margin-bottom: .3rem;
      text-shadow: 0 0 40px rgba(99,102,241,.5);
    }
    .live-date { font-size: .88rem; color: rgba(255,255,255,.4); text-align: center; margin-bottom: 2.5rem; }

    /* ── Portal grid ── */
    .portal-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 1.5rem; width: 100%; max-width: 520px;
    }
    @media (max-width: 640px) { .portal-grid { grid-template-columns: 1fr; } }

    /* ── Portal card base ── */
    .portal-card {
      border-radius: 24px; padding: 2rem;
      border: 1.5px solid transparent;
      position: relative; overflow: hidden;
      transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s ease;
      cursor: default;
    }

    /* ── STUDENT card — teal theme ── */
    .portal-card.student {
      background: linear-gradient(145deg, rgba(6,182,212,.12) 0%, rgba(16,185,129,.08) 100%);
      border-color: rgba(16,185,129,.3);
      box-shadow: 0 8px 40px rgba(16,185,129,.1), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .portal-card.student:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(16,185,129,.2), inset 0 1px 0 rgba(255,255,255,.1); }

    /* Card header */
    .card-head {
      display: flex; align-items: center; gap: .875rem; margin-bottom: 1.5rem;
    }
    .card-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
    }
    .student .card-icon { background: rgba(16,185,129,.2); box-shadow: 0 4px 16px rgba(16,185,129,.25); }
    .card-title { font-size: 1.1rem; font-weight: 800; color: white; }
    .card-sub   { font-size: .78rem; margin-top: .15rem; }
    .student .card-sub { color: rgba(16,185,129,.8); }

    /* ── ID input field ── */
    .id-field {
      display: flex; gap: .5rem; margin-bottom: 1rem;
    }
    .id-input {
      flex: 1; padding: .875rem 1rem;
      background: rgba(0,0,0,.35);
      border: 1.5px solid rgba(16,185,129,.25);
      border-radius: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem; font-weight: 900;
      color: #6ee7b7; letter-spacing: .18em;
      text-align: center; text-transform: uppercase;
      outline: none; transition: all .2s ease;
    }
    .id-input::placeholder { color: rgba(16,185,129,.25); letter-spacing: .1em; font-size: 1rem; }
    .id-input:focus {
      border-color: rgba(16,185,129,.7);
      background: rgba(0,0,0,.5);
      box-shadow: 0 0 0 3px rgba(16,185,129,.15), 0 0 20px rgba(16,185,129,.1);
      color: white;
    }

    /* ── Punch button ── */
    .punch-btn {
      width: 100%; padding: .95rem; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      letter-spacing: .02em;
    }
    .punch-btn.idle {
      background: linear-gradient(135deg, #0f766e, #f59e0b);
      color: white; box-shadow: 0 6px 24px rgba(15,118,110,.4);
    }
    .punch-btn.idle:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(245,158,11,.45); }
    .punch-btn.loading {
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.5);
      cursor: not-allowed;
    }
    .punch-btn.success-in  { background: linear-gradient(135deg,#0f766e,#14b8a6); color:white; box-shadow:0 6px 24px rgba(20,184,166,.5); }
    .punch-btn.success-out { background: linear-gradient(135deg,#dc2626,#e11d48); color:white; box-shadow:0 6px 24px rgba(225,29,72,.4); }
    .punch-btn.done        { background: rgba(255,255,255,.06); color:rgba(255,255,255,.4); cursor:not-allowed; }
    .punch-btn.error-state { background: rgba(239,68,68,.2); border:1px solid rgba(239,68,68,.4); color:#fca5a5; cursor:not-allowed; }
    .spin { width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Status result panel ── */
    .result-panel {
      margin-top: .875rem;
      border-radius: 12px; padding: .875rem 1rem;
      font-size: .82rem; font-weight: 500;
      display: none; animation: popIn .3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes popIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }
    .result-panel.in   { background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.3); color:#6ee7b7; display:block; }
    .result-panel.out  { background:rgba(239,68,68,.12);  border:1px solid rgba(239,68,68,.3);  color:#fca5a5; display:block; }
    .result-panel.done { background:rgba(245,158,11,.1);  border:1px solid rgba(245,158,11,.3); color:#fcd34d; display:block; }
    .result-panel.err  { background:rgba(239,68,68,.1);   border:1px solid rgba(239,68,68,.25); color:#fca5a5; display:block; }

    .result-name { font-size: .95rem; font-weight: 800; color: white; margin-bottom: .25rem; }
    .result-time { font-family: 'JetBrains Mono', monospace; font-size: .8rem; opacity: .7; }

    /* Device strip */
    .device-strip {
      display: flex; align-items: center; gap: .5rem;
      font-size: .72rem; color: rgba(16,185,129,.7);
      margin-bottom: 1rem; font-weight: 600;
    }
    .device-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; flex-shrink: 0; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .reg-link { text-align: center; margin-top: .875rem; font-size: .78rem; color: rgba(255,255,255,.3); }
    .reg-link a { color: #6ee7b7; font-weight: 700; text-decoration: none; }
    .reg-link a:hover { color: white; }

    .admin-entry {
      margin-top: 1.5rem; color: rgba(255,255,255,.5); font-size: .78rem;
      font-weight: 700; letter-spacing: .04em; transition: color .2s ease;
    }
    .admin-entry span { color: #fbbf24; margin-left: .35rem; }
    .admin-entry:hover { color: white; }

    .qr-access {
      margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .qr-access summary {
      color: rgba(255,255,255,.65); cursor: pointer; font-size: .8rem;
      font-weight: 700; text-align: center; list-style: none;
    }
    .qr-access summary::-webkit-details-marker { display: none; }
    .qr-access summary:hover { color: white; }
    .qr-scanner-area {
      width: 100%; max-width: 280px; aspect-ratio: 1; margin: 1rem auto;
      background: #020617; border-radius: 14px; overflow: hidden; position: relative;
      display: grid; place-items: center; color: rgba(255,255,255,.55); text-align: center;
    }
    .qr-scanner-area video { width: 100%; height: 100%; object-fit: cover; }
    .scan-frame { position: absolute; inset: 18px; border: 2px solid #fbbf24; border-radius: 10px; pointer-events: none; }
    .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: #fbbf24; animation: scanMove 2s linear infinite; }
    @keyframes scanMove { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
    .qr-controls { display: flex; gap: .5rem; }
    .qr-controls button { flex: 1; padding: .65rem; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(255,255,255,.08); color: white; cursor: pointer; font-weight: 700; }
    .qr-controls button:hover:not(:disabled) { background: rgba(251,191,36,.18); border-color: #fbbf24; }
    .qr-controls button:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="stars"  id="stars"></div>
<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="page">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-icon">🕒</div>
      <div>
        <div class="brand-name">Oasis Pulse</div>
        <div class="brand-tagline">Smart Attendance Hub</div>
      </div>
    </div>
  </div>

  <!-- Live clock -->
  <div class="live-clock" id="live-clock">00:00:00</div>
  <div class="live-date"  id="live-date">—</div>

  <!-- Student portal -->
  <div class="portal-grid">

    <!-- ══ STUDENT PORTAL ══ -->
    <div class="portal-card student">
      <div class="card-head">
        <div class="card-icon">🎓</div>
        <div>
          <div class="card-title">Student Portal</div>
          <div class="card-sub">Tracking ID only — no password</div>
        </div>
      </div>

      <div class="device-strip">
        <span class="device-dot"></span>
        <span id="device-label">Detecting device…</span>
      </div>
      <div class="location-status" id="punch-location-status">📍 Live location is requested at clock-in</div>

      <form id="punch-form" novalidate autocomplete="off">
        <div class="id-field">
          <input type="text" id="clock-id-input" class="id-input"
                 placeholder="Tracking ID (OT-XXXXXXXX)" maxlength="12"
                 autocapitalize="characters" spellcheck="false"
                 autocomplete="off" />
        </div>

        <button type="submit" class="punch-btn idle" id="punch-btn">
          <span id="punch-btn-text">⚡ Clock In / Clock Out</span>
        </button>
      </form>

      <div class="result-panel" id="result-panel">
        <div class="result-name" id="result-name"></div>
        <div id="result-msg"></div>
        <div class="result-time" id="result-time"></div>
      </div>

      <details class="qr-access">
        <summary>📷 Scan today's attendance QR code</summary>
        <div class="qr-scanner-area" id="scanner-area">
          <div id="scanner-placeholder">Camera is off</div>
          <video id="qr-video" style="display:none;" playsinline></video>
          <div class="scan-frame" id="scan-frame" style="display:none;"><div class="scan-line"></div></div>
        </div>
        <div id="qr-alert" class="result-panel"></div>
        <div class="qr-controls">
          <button type="button" id="start-scan-btn">Start camera</button>
          <button type="button" id="stop-scan-btn" disabled>Stop camera</button>
        </div>
      </details>

      <div class="reg-link">
        New student? <a href="register.html">Register here</a>
      </div>
    </div>

  </div><!-- .portal-grid -->

  <a class="admin-entry" href="admin-login.html">Staff access <span>→</span></a>

</div><!-- .page -->

<div id="toast-container" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;"></div>

<script src="js/api.js"></script>
<script src="js/fingerprint.js"></script>
<script src="js/location.js"></script>
<script>
  // ── Stars ──────────────────────────────────────────────
  (function(){
    const c=document.getElementById('stars');
    for(let i=0;i<140;i++){
      const s=document.createElement('div'); s.className='star';
      const z=.4+Math.random()*2.4;
      s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${1.5+Math.random()*3.5}s;animation-delay:${Math.random()*5}s`;
      c.appendChild(s);
    }
  })();

  // ── Auth redirect (if already logged in as admin) ─────
  const et=localStorage.getItem('tm_token'), eu=JSON.parse(localStorage.getItem('tm_user')||'null');
  if(et && eu && eu.role==='admin') window.location.href='admin.html';

  // ── If already logged in as student → pre-fill their ID
  if(et && eu && eu.role==='student'){
    const input=document.getElementById('clock-id-input');
    if(input && eu.clock_in_id) input.value=eu.clock_in_id;
  }

  // ── Live wall clock ────────────────────────────────────
  function updateClock(){
    const now=new Date();
    document.getElementById('live-clock').textContent=now.toLocaleTimeString('en-US',{hour12:false});
    document.getElementById('live-date').textContent=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  }
  updateClock(); setInterval(updateClock,1000);

  // ── Fingerprint ────────────────────────────────────────
  let fp=null;
  (async()=>{
    try{
      fp=await getFingerprint();
      document.getElementById('device-label').textContent='Device verified — …'+fp.slice(-8).toUpperCase();
    }catch(e){
      document.getElementById('device-label').textContent='Device detection failed';
    }
  })();

  // ── Auto-format ID input ───────────────────────────────
  const idInput=document.getElementById('clock-id-input');
  idInput.addEventListener('input',function(){
    let v=this.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
    if(v.length>0&&!v.startsWith('OT-')){
      if(v.startsWith('OT')) v='OT-'+v.slice(2);
      else if(!v.includes('-')) v='OT-'+v;
    }
    this.value=v;
  });

  // ── Show toast ─────────────────────────────────────────
  function toast(msg,color){
    const t=document.createElement('div');
    t.style.cssText=`background:${color};color:white;padding:.75rem 1.25rem;border-radius:12px;font-size:.85rem;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.4);max-width:320px;animation:slideIn .3s ease`;
    t.textContent=msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),350);},3500);
  }

  // ── Result panel helper ────────────────────────────────
  function showResult(type, name, msg, time){
    const panel=document.getElementById('result-panel');
    const btn  =document.getElementById('punch-btn');
    panel.className=`result-panel ${type}`;
    document.getElementById('result-name').textContent=name||'';
    document.getElementById('result-msg').textContent=msg||'';
    document.getElementById('result-time').textContent=time||'';

    if(type==='in'){
      btn.className='punch-btn success-out';
      document.getElementById('punch-btn-text').textContent='🚪 Clock Out now?';
      btn.disabled=false;
    } else if(type==='out'){
      btn.className='punch-btn done';
      document.getElementById('punch-btn-text').textContent='✅ Attendance Complete';
      btn.disabled=true;
    } else if(type==='done'){
      btn.className='punch-btn done';
      document.getElementById('punch-btn-text').textContent='✅ Already Complete Today';
      btn.disabled=true;
    } else {
      btn.className='punch-btn idle';
      document.getElementById('punch-btn-text').textContent='⚡ Clock In / Clock Out';
      btn.disabled=false;
    }
  }

  // ── Punch form ─────────────────────────────────────────
  let lastClockId = null;
  let lastToken   = null;
  let qrToken     = null;
  let punchState  = 'idle'; // idle | clocked_in | done

  document.getElementById('punch-form').addEventListener('submit', async e => {
    e.preventDefault();
    const clockId = idInput.value.trim().toUpperCase();

    if(!clockId || clockId.length < 4){
      showResult('err','','Please enter your Tracking ID (e.g. OT-ABC12345)','');
      return;
    }

    const btn=document.getElementById('punch-btn');
    btn.className='punch-btn loading'; btn.disabled=true;
    document.getElementById('punch-btn-text').innerHTML='<span class="spin"></span> Processing…';
    document.getElementById('result-panel').className='result-panel';

    try {
      const location = await getLiveLocation();
      setLocationStatus('punch-location-status', location);
      const data = await api.post('/attendance/punch', {
        clock_in_id: clockId,
        fingerprint: fp,
        qr_token: qrToken,
        latitude: location?.latitude,
        longitude: location?.longitude,
        accuracy: location?.accuracy
      });

      // Store auth from punch response
      if(data.token){
        localStorage.setItem('tm_token', data.token);
        localStorage.setItem('tm_user',  JSON.stringify(data.student));
      }

      lastClockId = clockId;
      lastToken   = data.token;
      qrToken = null;

      const att  = data.attendance;
      const ci   = att?.clock_in_time  ? new Date(att.clock_in_time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})  : null;
      const co   = att?.clock_out_time ? new Date(att.clock_out_time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : null;

      if(data.action==='clocked_in'){
        punchState='clocked_in';
        showResult('in', data.student.full_name, data.message, ci ? `Clocked in at ${ci}` : '');
        toast(data.message,'#10b981');
      } else if(data.action==='clocked_out'){
        punchState='done';
        showResult('out', data.student.full_name, data.message, `${ci} → ${co}`);
        toast(data.message,'#ef4444');
      } else if(data.action==='already_complete'){
        punchState='done';
        showResult('done', data.student?.full_name||'', data.error, `${ci} → ${co}`);
      }

    } catch(err) {
      btn.className='punch-btn idle'; btn.disabled=false;
      document.getElementById('punch-btn-text').textContent='⚡ Clock In / Clock Out';
      showResult('err','',err.message||'Something went wrong. Please try again.','');
    }
  });

  // ── QR scanner ─────────────────────────────────────────
  let videoStream = null;
  let scanning = false;
  let scanCanvas = null;
  let scanCtx = null;
  document.getElementById('start-scan-btn').addEventListener('click', startScanner);
  document.getElementById('stop-scan-btn').addEventListener('click', stopScanner);

  async function startScanner() {
    if (typeof jsQR === 'undefined') {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      script.onload = startScannerInternal;
      script.onerror = () => showQRAlert('QR scanner is unavailable. Enter your ID manually.', 'err');
      document.head.appendChild(script);
      return;
    }
    startScannerInternal();
  }

  async function startScannerInternal() {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.getElementById('qr-video');
      video.srcObject = videoStream;
      await video.play();
      video.style.display = 'block';
      document.getElementById('scanner-placeholder').style.display = 'none';
      document.getElementById('scan-frame').style.display = 'block';
      document.getElementById('start-scan-btn').disabled = true;
      document.getElementById('stop-scan-btn').disabled = false;
      scanCanvas = document.createElement('canvas');
      scanCtx = scanCanvas.getContext('2d');
      scanning = true;
      showQRAlert('Camera active. Hold the daily QR code in the frame.', 'in');
      requestAnimationFrame(scanFrame);
    } catch (err) {
      showQRAlert('Camera access was denied. Enter your ID manually.', 'err');
    }
  }

  function stopScanner() {
    scanning = false;
    if (videoStream) videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
    document.getElementById('qr-video').style.display = 'none';
    document.getElementById('scanner-placeholder').style.display = 'block';
    document.getElementById('scan-frame').style.display = 'none';
    document.getElementById('start-scan-btn').disabled = false;
    document.getElementById('stop-scan-btn').disabled = true;
  }

  function scanFrame() {
    if (!scanning) return;
    const video = document.getElementById('qr-video');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      scanCanvas.width = video.videoWidth;
      scanCanvas.height = video.videoHeight;
      scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
      const code = jsQR(scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height).data, scanCanvas.width, scanCanvas.height);
      if (code) {
        stopScanner();
        processQRCode(code.data);
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }

  function showQRAlert(message, type) {
    const alert = document.getElementById('qr-alert');
    alert.className = `result-panel ${type}`;
    alert.textContent = message;
  }

  function processQRCode(raw) {
    try {
      const payload = JSON.parse(raw);
      if (!payload.token) throw new Error('Invalid QR code format.');
      qrToken = payload.token;
      showQRAlert('QR verified. Enter your Tracking ID to clock in.', 'in');
      if (idInput.value.trim()) document.getElementById('punch-form').requestSubmit();
    } catch (err) {
      qrToken = null;
      showQRAlert(err.message || 'Invalid or expired QR code.', 'err');
    }
  }

</script>
</body>
</html>
